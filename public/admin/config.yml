  # ------------------------------------------------------------------ #
  # Open mics.                                                          #
  # ------------------------------------------------------------------ #
  - name: open_mics
    label: Open mics
    label_singular: Open mic
    folder: content/open-mics
    path: '{{slug}}/index'
    extension: json
    format: json
    identifier_field: name
    slug: '{{fields.venue}}-{{fields.city}}-{{fields.day}}'
    create: true
    summary: '{{fields.name}} ({{fields.city}}, {{fields.day}})'
    fields:
      - { name: name, label: Display name, widget: string }
      - { name: venue, label: Venue, widget: string, required: false }
      - { name: address, label: Address, widget: string, required: false }
      - { name: city, label: City, widget: string, required: false }
      - { name: region, label: Region, widget: select, default: WA, options: [{ label: Washington, value: WA }, { label: Oregon, value: OR }] }
      - { name: lat, label: Latitude, widget: number, value_type: float, required: false }
      - { name: lng, label: Longitude, widget: number, value_type: float, required: false }
      - { name: day, label: Day, widget: select, default: Monday, options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday] }
      - { name: frequency, label: Frequency, widget: select, default: weekly, options: [{ label: Weekly, value: weekly }, { label: Every other week, value: biweekly }, { label: Monthly, value: monthly }] }
      - { name: weeks, label: Weeks of month, widget: select, multiple: true, required: false, options: ['1st', '2nd', '3rd', '4th', Last], hint: 'Which weeks of the month it runs (for every-other-week / monthly). Leave empty for weekly.' }
      - { name: time, label: Time (display string), widget: string, required: false }
      - { name: host, label: Host, widget: string, required: false }
      - { name: signupUrl, label: Signup URL, widget: string, required: false }
      - { name: notes, label: Notes, widget: text, required: false }

