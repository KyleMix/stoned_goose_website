      - { name: poster, label: Preview image, widget: image, required: false, media_folder: /public/images/tiktok, public_folder: '', hint: 'A screenshot of the video works. Vertical, phone-screen shaped.' }
      - { name: posterAlt, label: Preview alt text, widget: string, required: false }
      - { name: draft, label: Hide from the site, widget: boolean, default: false }

  # ------------------------------------------------------------------ #
  # News posts. Render as cards (title + summary + image) on /watch and #
  # the home Latest strip. The markdown body is stored for a future     #
  # detail page but is not displayed yet.                               #
  # ------------------------------------------------------------------ #
  - name: news
    label: News posts
    label_singular: News post
    description: Announcement cards on /watch and the home Latest strip. The card is the whole story for now; the long body is saved for a future detail page.
    folder: content/news
    path: '{{slug}}/index'
    extension: md
    format: frontmatter
    identifier_field: title
    slug: '{{fields.title}}'
    create: true
    summary: "{{fields.title}} · {{fields.date | date('MMM D, YYYY')}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_filters:
      - label: Featured
        field: featured
        pattern: true
      - label: Hidden drafts
        field: draft
        pattern: true
    fields:
      - { name: title, label: Title, widget: string, pattern: ['^[^—]*$', 'No em dashes.'] }
      - { name: date, label: Publish date, widget: datetime, format: 'YYYY-MM-DD', time_format: false, hint: 'Newest first on the site.' }
      - { name: summary, label: Card text, widget: text, pattern: ['^[^—]*$', 'No em dashes.'], hint: 'The two or three sentences shown on the card. This is the whole story for now.' }
      - { name: image, label: Card image, widget: image, required: false, media_folder: /public/images/news, public_folder: /images/news, hint: 'Wide 16:9 image, at least 1200x675 pixels.' }
      - { name: imageAlt, label: Card image alt text, widget: string, required: false, hint: 'Describe the image for screen readers.' }
      - { name: featured, label: Pin to the top of the Latest strip, widget: boolean, default: false }
      - { name: tags, label: Tags, widget: list, required: false, field: { name: tag, label: Tag, widget: string } }
      - { name: draft, label: Hide from the site, widget: boolean, default: false }
      - { name: body, label: Long version (saved for a future detail page, not shown yet), widget: markdown, required: false }

  # ------------------------------------------------------------------ #
  # Pages: composed from blocks, render at /<slug>.                     #
  # ------------------------------------------------------------------ #
  - name: pages
    label: Extra pages
    label_singular: Page
    description: Standalone pages built from blocks. A page titled "About" goes live at /about. To put it in the menu, add it under Site copy, Site config, Primary nav.
    folder: content/pages
    path: '{{slug}}/index'
    extension: json
    format: json
    identifier_field: title
    slug: '{{fields.title}}'
    create: true
    summary: '{{fields.title}}'
    view_filters:
      - label: Hidden drafts
        field: draft
        pattern: true
    fields:
      - { name: title, label: Page title, widget: string, pattern: ['^[^—]*$', 'No em dashes.'], hint: 'Also sets the address: "About" becomes /about. Some names are reserved by the site (shows, watch, roster, book, shop, contact, open-mics) and will fail the deploy.' }
      - { name: sections, label: Page sections, widget: list, required: false, types: *section_types, hint: 'The page body. Add blocks with the plus button, drag to reorder.' }
      - { name: seoDescription, label: Search result description, widget: text, required: false, pattern: ['^[^—]*$', 'No em dashes.'], hint: 'What search results show under the title. Aim for under 160 characters and be specific about the page.' }
      - { name: ogImage, label: Social share image, widget: image, required: false, media_folder: /public/images/pages, public_folder: /images/pages, hint: 'Shown when the page is shared on social media. Wide image, 1200x630 pixels.' }
      - { name: draft, label: Hide from the live site, widget: boolean, default: false }
