  # ------------------------------------------------------------------ #
  # News posts. Render as cards (title + summary + image) on /watch and #
  # the home Latest strip. The markdown body is stored for a future     #
  # detail page but is not displayed yet.                               #
  # ------------------------------------------------------------------ #
  - name: news
    label: News posts
    label_singular: News post
    folder: content/news
    path: '{{slug}}/index'
    extension: md
    format: frontmatter
    identifier_field: title
    slug: '{{fields.title}}'
    create: true
    summary: '{{fields.title}}'
    fields:
      - { name: title, label: Title, widget: string, pattern: ['^[^—]*$', 'No em dashes.'] }
