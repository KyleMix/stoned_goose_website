# Refresh social feeds (Instagram, Facebook) and show listings (Eventbrite,
# Facebook events) every 6 hours.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   INSTAGRAM_ACCESS_TOKEN        long-lived IG user token (~60 day expiry)
#   FACEBOOK_PAGE_ACCESS_TOKEN    page-level access token (prefer never-expiring)
#   EVENTBRITE_TOKEN              Eventbrite private token (Account Settings ->
#                                 Developer Links -> API Keys)
#   EVENTBRITE_ORGANIZER_ID       optional, defaults to the Stoned Goose
#                                 organizer id baked into scripts/sync-shows.ts
#   FACEBOOK_PAGE_ID              optional, enables the FB events merge
#
# The fetch scripts skip silently when their env vars are unset, so this
# workflow stays green even before the secrets are configured. Failures on
# any one platform do not block the others (continue-on-error: true).
#
# Each successful run that produces a diff is committed back to the branch.
# The commit message must NOT contain [skip ci]: the host (Cloudflare)
# honors that marker and would skip the rebuild, leaving the live site
# stale. Loops are impossible anyway: pushes made with the workflow's
# GITHUB_TOKEN never trigger other workflows, and this one only runs on
# schedule or manual dispatch.

name: Refresh social feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Pull latest social content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Instagram
        continue-on-error: true
        run: npm run feeds:instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

      - name: Fetch Facebook
        continue-on-error: true
        run: npm run feeds:facebook
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

      - name: Fetch Eventbrite shows
        continue-on-error: true
        run: npm run sync:shows
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORGANIZER_ID: ${{ secrets.EVENTBRITE_ORGANIZER_ID }}

      # Runs after sync:shows on purpose: it merges FB events into the
      # Eventbrite-sourced shows.json, and Eventbrite wins on dupes.
      - name: Fetch Facebook events
        continue-on-error: true
        run: npm run sync:facebook-events
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

      - name: Fetch pro comedy shows
        continue-on-error: true
        run: npm run sync:pro-shows

      - name: Commit refreshed feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(feeds): refresh social content"
          file_pattern: "content/feeds/*.json content/.generated/pro-shows.json content/.generated/shows.json"
