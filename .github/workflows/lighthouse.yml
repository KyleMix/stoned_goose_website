name: Lighthouse

on:
  pull_request:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # .lighthouserc.json asserts performance, accessibility and SEO on all
      # eight routes, and best-practices on seven of them. /book.html is
      # exempt from best-practices only: it mounts the Cal.com scheduler,
      # which sets three third-party cookies (__cf_bm on embed.js, and
      # __Secure-next-auth.csrf-token / .callback-url on /api/auth/session).
      # That zeroes third-party-cookies (weight 5) and inspector-issues
      # (weight 1), pinning the category at 21/27 = 0.78 no matter what this
      # repo does. It is cal.com's cookie policy being measured, not our
      # code. Revisit if the scheduler ever moves behind a click.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --config=./.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          if-no-files-found: ignore
