# Host-level nginx vhost for serving /out without Docker.
#
# Use when you'd rather rsync /out to a server and let the OS nginx serve
# it. Drop in /etc/nginx/sites-available/stoned-goose, symlink to
# sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS termination is left to certbot:
#   sudo certbot --nginx -d stonedgooseproductions.com -d www.stonedgooseproductions.com

map $uri $og_image {
    default                                       0;
    "~^/[^/]+/opengraph-image$"                   1;
    "~^/services/[^/]+/opengraph-image$"          1;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  stonedgooseproductions.com www.stonedgooseproductions.com;

    # Document root is the rsynced static export.
    root /var/www/stoned-goose/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss application/atom+xml
        image/svg+xml
        font/ttf font/otf font/woff font/woff2;

    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot|ico|png|jpe?g|gif|webp|avif|svg|mp4|webm)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location /pagefind/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Old-slug redirects (mirror of public/_redirects).
    location = /about              { return 308 /roster; }
    location = /members            { return 308 /roster; }
    location = /comedians          { return 308 /roster; }
    location = /media              { return 308 /watch; }
    location = /book-a-show        { return 308 /book; }
    location = /services           { return 308 /book; }
    location = /submit             { return 308 /book; }
    location = /comic-submissions  { return 308 /book; }
    location = /sponsor            { return 308 /book#sponsors; }
    location = /sponsorships       { return 308 /book#sponsors; }

    # CMS admin. Sveltia is a static app at /admin using hash routing.
    location ^~ /admin/            { try_files $uri $uri/ /admin/index.html; }

    location ~* /opengraph-image$ {
        default_type image/png;
        add_header Content-Type "image/png" always;
        try_files $uri $uri.png =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
