# nginx vhost for the static export.
#
# Handles three things public/_redirects and vercel.json handle on the
# managed hosts:
#   1. Old-slug 308 redirects (matches public/_redirects exactly).
#   2. Forced image/png MIME on extensionless /<route>/opengraph-image.
#   3. Pretty URLs without trailing slash (matches Next's trailingSlash: false).
#
# Drop-in target is the default nginx image at /etc/nginx/conf.d/site.conf.

map $uri $og_image {
    default                                       0;
    "~^/[^/]+/opengraph-image$"                   1;
    "~^/services/[^/]+/opengraph-image$"          1;
}

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset for HTML.
    charset utf-8;

    # gzip on. Brotli would be better; the alpine image does not ship it,
    # but Caddy/Cloudflare in front handles it transparently.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Long cache for fingerprinted Next.js build assets. Everything under
    # /_next/static/ ships with a content-hash filename so it is safe to
    # immutable-cache.
    location /_next/static/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Hashed images / fonts in /public.
    location ~* \.(?:woff2?|ttf|otf|eot|ico|png|jpe?g|gif|webp|avif|svg|mp4|webm)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Pagefind search index. Long cache; the bundle is regenerated on each
    # postbuild.
    location /pagefind/ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # ----- Old-slug redirects (mirror of public/_redirects) -----
    location = /about              { return 308 /roster; }
    location = /members            { return 308 /roster; }
    location = /comedians          { return 308 /roster; }
    location = /media              { return 308 /watch; }
    location = /book-a-show        { return 308 /book; }
    location = /services           { return 308 /book; }
    location = /submit             { return 308 /book; }
    location = /comic-submissions  { return 308 /book; }
    location = /sponsor            { return 308 /book#sponsors; }
    location = /sponsorships       { return 308 /book#sponsors; }

    # CMS admin. Sveltia is a static app at /admin (public/admin/index.html)
    # and uses hash routing, so it just needs the index served for /admin.
    location ^~ /admin/            { try_files $uri $uri/ /admin/index.html; }

    # OG image MIME. Extensionless routes from app/<route>/opengraph-image.tsx
    # ship as PNG; force the content type so social scrapers render the card.
    location ~* /opengraph-image$ {
        default_type image/png;
        add_header Content-Type "image/png" always;
        try_files $uri $uri.png =404;
    }

    # ----- Default: pretty URL routing -----
    # Try literal file, then directory index, then .html, then 404 page.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Custom 404. Next's static export writes one at /404.html.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Security headers. Add HSTS only when behind HTTPS (Caddy / Cloudflare).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide nginx version in Server header.
    server_tokens off;
}
